name: wine-build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine build dependencies
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              $deb \\
  (for \\
  *.deb; \\
  +x \\
  -L \\
  -a \\
  -m \\
  -o \\
  -p \\
  -rf \\
  -s \\
  -x \\
  ;; \\
  apt-get \\
  arm64) \\
  chmod \\
  clean \\
  cp \\
  curl \\
  deb \\
  do \\
  done) \\
  download \\
  dpkg-deb \\
  esac \\
  g++-mingw-w64-i686 \\
  g++-mingw-w64-x86-64 \\
  gcc \\
  gcc-mingw-w64-i686 \\
  gcc-mingw-w64-x86-64 \\
  gcc-multilib \\
  gitlab \\
  gstreamer1.0-libav:i386 \\
  gstreamer1.0-plugins-bad:i386 \\
  gstreamer1.0-plugins-base:i386 \\
  gstreamer1.0-plugins-good:i386 \\
  gstreamer1.0-plugins-ugly:i386 \\
  in \\
  libasound2-dev:i386 \\
  libasound2-plugins:i386 \\
  libavcodec-dev:i386 \\
  libavformat-dev:i386 \\
  libavutil-dev:i386 \\
  libcapi20-dev:i386 \\
  libcups2-dev:i386 \\
  libdbus-1-dev:i386 \\
  libfontconfig-dev:i386 \\
  libfreetype-dev:i386 \\
  libgl1-mesa-dev:i386 \\
  libgnutls28-dev:i386 \\
  libgphoto2-dev:i386 \\
  libgstreamer-plugins-base1.0-dev:i386 \\
  libgstreamer1.0-dev:i386 \\
  libice-dev:i386 \\
  libkrb5-dev:i386 \\
  liborc-0.4-dev:i386 \\
  libpcap-dev:i386 \\
  libpcsclite-dev:i386 \\
  libpulse-dev:i386 \\
  libsane-dev:i386 \\
  libsdl2-dev:i386 \\
  libswresample-dev:i386 \\
  libswscale-dev:i386 \\
  libudev-dev:i386 \\
  libunwind-dev \\
  libusb-1.0-0-dev:i386 \\
  libv4l-dev:i386 \\
  libva-dev:i386 \\
  libvulkan-dev:i386 \\
  libwayland-dev:i386 \\
  libx11-dev:i386 \\
  libxcomposite-dev:i386 \\
  libxcursor-dev:i386 \\
  libxext-dev:i386 \\
  libxi-dev:i386 \\
  libxinerama-dev:i386 \\
  libxkbcommon-dev:i386 \\
  libxkbregistry-dev:i386 \\
  libxrandr-dev:i386 \\
  libxrender-dev:i386 \\
  libxxf86vm-dev:i386 \\
  linux-libc-dev:i386 \\
  mesa-vulkan-drivers:i386 \\
  mkdir \\
  mv \\
  ocl-icd-opencl-dev:i386 \\
  rm \\
  samba-dev:i386 \\
  tar \\
  unixodbc-dev:i386 \\
  useradd \\
  xJ \\
            |

      - uses: actions/cache@v4
        with:
          path: ccache
          key: ccache-wine-${{ github.run_id }}
          restore-keys: ccache-wine-

      - name: Generate sources
        run: |
          set -Eeuxo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          ./tools/make_requests
          ./tools/make_specfiles
          ./tools/make_makefiles
          autoreconf -f

      - name: Build 64-bit
        run: |
          set -Eeuxo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p build64 && cd build64
          ../configure -q -C --enable-win64 --with-mingw
          make -s -j$(nproc)

      - name: Build 32-bit
        run: |
          set -Eeuxo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p build32 && cd build32
          ../configure -q -C --with-mingw
          make -s -j$(nproc)

      - name: Stage install tree
        run: |
          set -Eeuxo pipefail
          make -s -C build32 install DESTDIR=$GITHUB_WORKSPACE/inst
          make -s -C build64 install DESTDIR=$GITHUB_WORKSPACE/inst
          du -sh inst/

      - name: Sanity check binaries
        run: |
          file inst/usr/local/lib/wine/x86_64-unix/ntdll.so 2>/dev/null || true
          file inst/usr/local/lib/wine/i386-unix/ntdll.so 2>/dev/null || true
          ls inst/usr/local/bin/

      - uses: actions/upload-artifact@v4
        with:
          name: wine-build-${{ github.run_number }}
          path: inst/
          compression-level: 6
          retention-days: 30
