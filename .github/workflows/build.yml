name: wine-build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine build dependencies
        run: |
          sudo apt-get update -q
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            autoconf \
            bison \
            ca-certificates \
            ccache \
            clang \
            curl \
            flex \
            fonts-liberation2 \
            fonts-noto-cjk \
            fonts-noto-core \
            gettext \
            git \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            jq \
            libasound2-dev \
            libasound2-plugins \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libcapi20-dev \
            libcups2-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libgnutls28-dev \
            libgphoto2-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libice-dev \
            libkrb5-dev \
            libpcap-dev \
            libpcsclite-dev \
            libpulse-dev \
            libsane-dev \
            libsdl2-dev \
            libswresample-dev \
            libswscale-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libv4l-dev \
            libva-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbregistry-dev \
            libxrandr-dev \
            libxrender-dev \
            libxxf86vm-dev \
            linux-libc-dev \
            lld \
            llvm \
            mesa-vulkan-drivers \
            nasm \
            netbase \
            ocl-icd-opencl-dev \
            perl \
            samba-dev \
            unixodbc-dev \
            unzip

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            gcc \
            gcc-mingw-w64-i686 \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-i686 \
            g++-mingw-w64-x86-64 \
            gcc-multilib \
            libunwind-dev \
            gstreamer1.0-libav:i386 \
            gstreamer1.0-plugins-bad:i386 \
            gstreamer1.0-plugins-base:i386 \
            gstreamer1.0-plugins-good:i386 \
            gstreamer1.0-plugins-ugly:i386 \
            libasound2-dev:i386 \
            libasound2-plugins:i386 \
            libavcodec-dev:i386 \
            libavformat-dev:i386 \
            libavutil-dev:i386 \
            libcapi20-dev:i386 \
            libcups2-dev:i386 \
            libdbus-1-dev:i386 \
            libfontconfig-dev:i386 \
            libfreetype-dev:i386 \
            libgl1-mesa-dev:i386 \
            libgnutls28-dev:i386 \
            libgphoto2-dev:i386 \
            libice-dev:i386 \
            libkrb5-dev:i386 \
            liborc-0.4-dev:i386 \
            libpcap-dev:i386 \
            libpcsclite-dev:i386 \
            libpulse-dev:i386 \
            libsane-dev:i386 \
            libsdl2-dev:i386 \
            libswresample-dev:i386 \
            libswscale-dev:i386 \
            libudev-dev:i386 \
            libusb-1.0-0-dev:i386 \
            libv4l-dev:i386 \
            libva-dev:i386 \
            libvulkan-dev:i386 \
            libwayland-dev:i386 \
            libx11-dev:i386 \
            libxcomposite-dev:i386 \
            libxcursor-dev:i386 \
            libxext-dev:i386 \
            libxi-dev:i386 \
            libxinerama-dev:i386 \
            libxkbcommon-dev:i386 \
            libxkbregistry-dev:i386 \
            libxrandr-dev:i386 \
            libxrender-dev:i386 \
            libxxf86vm-dev:i386 \
            linux-libc-dev:i386 \
            mesa-vulkan-drivers:i386 \
            ocl-icd-opencl-dev:i386 \
            samba-dev:i386 \
            unixodbc-dev:i386

          # gstreamer i386 dev packages conflict with the amd64 ones - extract manually
          mkdir -p /dpkg && cd /dpkg
          apt-get download libgstreamer-plugins-base1.0-dev:i386 libgstreamer1.0-dev:i386
          for deb in *.deb; do sudo dpkg-deb -x "$deb" /dpkg; done
          sudo cp -a /dpkg/usr/lib/i386-linux-gnu/. /usr/lib/
          cd "$GITHUB_WORKSPACE" && sudo rm -rf /dpkg

          # OSS soundcard.h header (wine build needs it)
          sudo mkdir -p /usr/lib/oss/include/sys
          sudo curl -s -o /usr/lib/oss/include/sys/soundcard.h https://salsa.debian.org/debian/oss4/-/raw/debian/4.2-build2020-6/include/soundcard.h

      - uses: actions/cache@v4
        with:
          path: ccache
          key: ccache-wine-${{ github.run_id }}
          restore-keys: ccache-wine-

      - name: Generate sources
        run: |
          set -Eeuxo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          ./tools/make_requests
          ./tools/make_specfiles
          ./tools/make_makefiles
          autoreconf -f

      - name: Build 64-bit
        run: |
          set -Eeuxo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p build64 && cd build64
          ../configure -q -C --enable-win64 --with-mingw
          make -s -j$(nproc)

      - name: Build 32-bit
        run: |
          set -Eeuxo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p build32 && cd build32
          ../configure -q -C --with-mingw
          make -s -j$(nproc)

      - name: Stage install tree
        run: |
          set -Eeuxo pipefail
          make -s -C build32 install DESTDIR=$GITHUB_WORKSPACE/inst
          make -s -C build64 install DESTDIR=$GITHUB_WORKSPACE/inst
          du -sh inst/

      - name: Sanity check binaries
        run: |
          file inst/usr/local/lib/wine/x86_64-unix/ntdll.so 2>/dev/null || true
          file inst/usr/local/lib/wine/i386-unix/ntdll.so 2>/dev/null || true
          ls inst/usr/local/bin/

      - uses: actions/upload-artifact@v4
        with:
          name: wine-build-${{ github.run_number }}
          path: inst/
          compression-level: 6
          retention-days: 30
